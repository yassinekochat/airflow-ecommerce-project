
        <!DOCTYPE html>
        <html>

        <head>

            <title>E-Commerce Dashboard</title>

            <style>

                body{
                    font-family:Arial;
                    background:#f4f6f9;
                    margin:40px;
                }

                h1{
                    text-align:center;
                    color:#2c3e50;
                }

                .container{
                    display:flex;
                    flex-wrap:wrap;
                    justify-content:center;
                    gap:20px;
                    margin-top:40px;
                }

                .card{
                    background:white;
                    width:250px;
                    padding:20px;
                    border-radius:10px;
                    box-shadow:0 2px 10px rgba(0,0,0,.15);
                    text-align:center;
                }

                .metric{
                    font-size:18px;
                    color:#555;
                }

                .value{
                    font-size:32px;
                    color:#0078D4;
                    font-weight:bold;
                    margin-top:10px;
                }

            </style>

        </head>

        <body>

            <h1>E-Commerce KPI Dashboard</h1>

            <div class="container">
        

            <div class="card">

                <div class="metric">
                    Total Orders
                </div>

                <div class="value">
                    98666
                </div>

            </div>

            

            <div class="card">

                <div class="metric">
                    Total Sales
                </div>

                <div class="value">
                    13591643.7
                </div>

            </div>

            

            <div class="card">

                <div class="metric">
                    Average Price
                </div>

                <div class="value">
                    120.65
                </div>

            </div>

            

            <div class="card">

                <div class="metric">
                    Top Category
                </div>

                <div class="value">
                    cama_mesa_banho
                </div>

            </div>

            

            </div>

        </body>

        </html>
